[[menu.main]]
name = "Construction Workshops"
url = "/construction-workshops"
weight = 2
parent = "Services"
[[menu.main]]
name = "Alternative Learning Provision"
url = "/alternative-learning-provision"
weight = 3
parent = "Services"
[[menu.main]]
name = "Testimonials"
url = "/testimonials"
weight = 40
[[menu.main]]
name = "Case Studies"
url = "/case-studies"
weight = 45
[[menu.main]]
