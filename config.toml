DefaultContentLanguage = "en"
MetaDataFormat = "yaml"
pagination.pagerSize = 3
# Absolute URLs for sitemap, canonicals, and Open Graph (Netlify <base> still uses CONTEXT).
baseURL = "https://www.sportingchanceproject.co.uk/"
description = "Alternative learning provision and mentoring in Bristol for young people who struggle in mainstream school."
enableRobotsTXT = true
googleAnalytics = ""
languageCode = "en-gb"
relativeURLs = false
title = "Sporting Chance"

[[menu.main]]
name = "About"
url = "/about"
weight = 20
[[menu.main]]
name = "Services"
url = "/services"
weight = 30
[[menu.main]]
name = "Mentoring & Life Skills"
url = "/mentoring-life-skills"
weight = 1
