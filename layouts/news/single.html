{{ define "main" }}
{{ partial "blocks/generic-header" (dict "Params" (dict "title" .Title "subtext" .Description) "theme" "teal") }}

<section class="leaflet-theme-teal w-full sc-section--left">
  <div class="leaflet-band leaflet-band--light leaflet-panel-band">
    <div class="leaflet-geo" aria-hidden="true">
      <span class="leaflet-geo__shape leaflet-geo__shape--a"></span>
      <span class="leaflet-geo__shape leaflet-geo__shape--b"></span>
    </div>
    <div class="leaflet-band__inner sc-page-gutter">
      <article class="leaflet-panel leaflet-panel--left sc-case-study sc-news sc-reveal sc-reveal--left" data-reveal data-reveal-delay-ms="120">
        {{ if not .Date.IsZero }}
        <p class="leaflet-panel__body" style="margin-bottom:0.75rem">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
        </p>
        {{ end }}
        <div class="leaflet-panel__body sc-case-study__body sc-news__body">
          {{ .Content }}
        </div>
        <div class="leaflet-panel__actions sc-section__actions">
          <a href="{{ "/news/" | relURL }}" class="leaflet-panel__btn">All news</a>
        </div>
      </article>
    </div>
  </div>
</section>
{{ end }}
