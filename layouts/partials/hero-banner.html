<section class="hero-b hero-with-nav-offset relative z-0 overflow-hidden" data-parallax-hero>
  <div class="hero-b__media" aria-hidden="true">
    <div
      class="hero-b__parallax"
      style="background-image: url({{ .Params.hero_bg }});"
      data-parallax-layer></div>
    <div class="hero-b__tint"></div>
  </div>

  {{/* Two large translucent triangles — ALP-inspired depth over the photo */}}
  <div class="hero-b__triangles" aria-hidden="true">
    <span class="hero-b__tri hero-b__tri--a"></span>
    <span class="hero-b__tri hero-b__tri--b"></span>
  </div>

  <div class="hero-b__content sm:w-4/5 w-5/6 m-auto text-center pt-10 relative z-20">
    <div class="mw6 pv5 animated fadeIn">
      <p class="hero-b__brand font-header uppercase tracking-widest">
        Sporting Chance Project
      </p>
      <h1 class="font-header text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-medium text-white my-2 py-5">
        {{ .Params.hero_text | safeHTML }}
      </h1>
      <p class="font-main lg:text-2xl text-xl leading-normal text-white" style="opacity:0.92">
        {{ .Params.hero_sub }}
      </p>
      <div class="my-12">
        <a
          class="hero-b__cta shadow hover:shadow-lg trans-02 my-5 text-xl rounded mt-4 py-4 px-6 text-right font-semibold no-underline text-white inline-block"
          href="{{ .Params.herolink }}">{{ .Params.herobuttontext }} →</a>
      </div>
    </div>
  </div>

  {{/* Low, highly transparent dual-triangle edge at the base of the hero */}}
  <div class="hero-b__edge" aria-hidden="true">
    <svg class="hero-b__edge-svg" viewBox="0 0 100 12" preserveAspectRatio="none" focusable="false">
      <polygon class="hero-b__edge-a" points="0,12 0,4 42,12" />
      <polygon class="hero-b__edge-b" points="28,12 100,0 100,12" />
    </svg>
  </div>
</section>
