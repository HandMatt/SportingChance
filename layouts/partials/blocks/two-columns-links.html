<section class="w-11/12 sm:w-10/12 md:w-11/12 lg:w-10/12 mx-auto my-8 py-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 items-stretch">
      {{ range .Params.columns }}
      <div class="text-center flex flex-col items-center h-full">
        <h2 class="font-header text-4xl sm:text-5xl font-gray font-medium leading-tight pt-10 pb-3 w-full min-h-[12rem] sm:min-h-[14rem] flex items-end justify-center">
            <span class="w-full text-center">{{ .header }}</span>
        </h2>
        <p class="font-main lg:text-2xl text-lg leading-normal text-grey-darkest flex-grow text-center">{{ .main_text | safeHTML }}</p>
        <div class="mt-auto my-12">
          <a href="{{ .buttonlink }}"
            class="trans-02 border-2 border-black hover:border-transparent hover:bg-sc-blue my-5 text-xl rounded mt-4 p-4 text-right font-semibold no-underline text-black hover:text-white block w-fit button-style">{{ .buttontext }} →</a>
        </div>
      </div>
      {{ end }}
    </div>
  </section>
