{{- $theme := "teal" -}}
{{- if reflect.IsMap . -}}
  {{- with index . "theme" -}}{{- $theme = . -}}{{- end -}}
{{- end -}}
<section class="leaflet-theme-{{ $theme }} w-full">
  <div class="leaflet-band leaflet-panel-band">
    <div class="leaflet-geo" aria-hidden="true">
      <span class="leaflet-geo__shape leaflet-geo__shape--a"></span>
      <span class="leaflet-geo__shape leaflet-geo__shape--b"></span>
    </div>
    <div class="leaflet-watermark leaflet-watermark--logo" aria-hidden="true">
      <img src="/img/scplogo1.png" alt="" />
    </div>
    <div class="leaflet-band__inner max-w-5xl mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8 items-stretch">
        {{ range .Params.columns }}
        <div class="leaflet-panel flex flex-col items-center h-full text-center">
          <h2 class="leaflet-panel__title" style="min-height:auto;padding:0">{{ .header }}</h2>
          <p class="leaflet-panel__body flex-grow">{{ .main_text | safeHTML }}</p>
          <div class="leaflet-panel__actions mt-auto">
            <a href="{{ .buttonlink }}" class="leaflet-panel__btn">{{ .buttontext }} →</a>
          </div>
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
