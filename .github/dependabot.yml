# Version updates for Yarn/npm (package-ecosystem "npm" covers yarn.lock).
# Security updates still open separately when alerts have a fix — they do not
# wait for this schedule.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Tailwind 3, Babel 7, and Webpack 5 are the site toolchain. Major bumps
    # (especially Tailwind 4) fail the Netlify build and kept reopening as one
    # grouped PR. Security update PRs are not affected by this ignore.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
