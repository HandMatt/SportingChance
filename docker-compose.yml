services:
  hugo:
    image: jakejarvis/hugo-extended:latest
    ports:
      # Host 4321 avoids Cursor/Windows often holding Hugo’s default 1313.
      # Hugo still listens (HTTP + LiveReload) on container :1313; --liveReloadPort
      # only tells the browser the host/proxy port (same idea as HTTPS on :443).
      - "4321:1313"
    volumes:
      - ./:/src
    command: server --buildDrafts --buildFuture --bind 0.0.0.0 --liveReloadPort 4321

  assets:
    build:
      context: .
      dockerfile: Dockerfile.assets
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    # webpack --watch is the image CMD; install is a separate step
